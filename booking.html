
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026 - Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h2>IPL 2026</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#matches">Matches</a>
            <a href="booking.html">Book Ticket</a>
            <a href="index.html#guidelines">Guidelines</a>
        </nav>
    </header>

    <section id="booking-page">
        <h1>IPL 2026 Ticket Booking</h1>
        <p>Fill in the details below to book your tickets.</p>

        <form action="#" method="get">

            <label for="name">Full Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                minlength="3"
                maxlength="50"
                required
            >

            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10-digit phone number"
                pattern="[0-9]{10}"
                minlength="10"
                maxlength="10"
                title="Please enter exactly 10 digits"
                required
            >

            <label for="match">Select Match:</label>
            <select id="match" name="match" required>
                <option value="">-- Choose a Match --</option>
                <option value="CSK vs MI">CSK vs MI</option>
                <option value="RCB vs KKR">RCB vs KKR</option>
                <option value="MI vs RCB">MI vs RCB</option>
            </select>

            <label for="stand">Stand Category:</label>
            <select id="stand" name="stand" required>
                <option value="">-- Choose Stand --</option>
                <option value="General">General</option>
                <option value="Premium">Premium</option>
                <option value="VIP">VIP</option>
            </select>

            <label for="tickets">Number of Tickets:</label>
            <input
                type="number"
                id="tickets"
                name="tickets"
                min="1"
                max="10"
                required
            >

            <p>Additional Booking Preference:</p>

            <label>
                <input type="radio" name="preference" value="Regular" required>
                Regular Seating
            </label>

            <label>
                <input type="radio" name="preference" value="Family">
                Family Seating
            </label>

            <br>

            <button type="submit">Submit Booking</button>
            <button type="reset">Reset Form</button>

        </form>
    </section>

    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

</body>
</html>
